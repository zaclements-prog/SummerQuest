<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SummerQuest app icon: a smiling toon sun over a little island, in the game's palette
       (warm ink outline #3a2c38, quest yellow, ocean blue, grass green). No text, so it reads at 48px. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74c0ef"/>
      <stop offset="0.72" stop-color="#bfe4f6"/>
      <stop offset="1" stop-color="#e4f4fa"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb3e8"/>
      <stop offset="1" stop-color="#2f8fd0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- sun rays -->
    <g transform="translate(256 190)" fill="#ffd23f" stroke="#3a2c38" stroke-width="10" stroke-linejoin="round">
      <path d="M0-166 L20-118 L-20-118Z"/>
      <path d="M0-166 L20-118 L-20-118Z" transform="rotate(45)"/>
      <path d="M0-166 L20-118 L-20-118Z" transform="rotate(90)"/>
      <path d="M0-166 L20-118 L-20-118Z" transform="rotate(135)"/>
      <path d="M0-166 L20-118 L-20-118Z" transform="rotate(-45)"/>
      <path d="M0-166 L20-118 L-20-118Z" transform="rotate(-90)"/>
      <path d="M0-166 L20-118 L-20-118Z" transform="rotate(-135)"/>
    </g>
    <!-- sun -->
    <circle cx="256" cy="190" r="100" fill="#ffd23f" stroke="#3a2c38" stroke-width="12"/>
    <circle cx="256" cy="190" r="76" fill="#ffe27a"/>
    <!-- face -->
    <ellipse cx="220" cy="176" rx="12" ry="17" fill="#3a2c38"/>
    <ellipse cx="292" cy="176" rx="12" ry="17" fill="#3a2c38"/>
    <circle cx="224" cy="170" r="5" fill="#fffaf0"/>
    <circle cx="296" cy="170" r="5" fill="#fffaf0"/>
    <ellipse cx="196" cy="212" rx="16" ry="10" fill="#ff9a8a" opacity="0.85"/>
    <ellipse cx="316" cy="212" rx="16" ry="10" fill="#ff9a8a" opacity="0.85"/>
    <path d="M226 220 Q256 250 286 220" fill="none" stroke="#3a2c38" stroke-width="11" stroke-linecap="round"/>
    <!-- sea -->
    <path d="M-10 392 Q64 372 128 392 T256 392 T384 392 T522 392 V522 H-10Z" fill="url(#sea)" stroke="#3a2c38" stroke-width="10"/>
    <!-- island -->
    <path d="M150 412 Q256 318 362 412 Z" fill="#7cc95b" stroke="#3a2c38" stroke-width="12" stroke-linejoin="round"/>
    <path d="M128 414 Q256 390 384 414 L372 430 Q256 412 140 430 Z" fill="#f3d79a" stroke="#3a2c38" stroke-width="10" stroke-linejoin="round"/>
    <!-- palm -->
    <path d="M326 386 Q334 352 326 326" fill="none" stroke="#3a2c38" stroke-width="20" stroke-linecap="round"/>
    <path d="M326 386 Q334 352 326 326" fill="none" stroke="#c98a4b" stroke-width="10" stroke-linecap="round"/>
    <g fill="#5fb84a" stroke="#3a2c38" stroke-width="9" stroke-linejoin="round">
      <path d="M326 326 Q290 294 254 320 Q294 336 326 338Z"/>
      <path d="M326 326 Q362 292 398 314 Q360 336 326 338Z"/>
      <path d="M326 330 Q314 290 346 268 Q350 304 332 334Z"/>
    </g>
    <!-- waves -->
    <path d="M40 466 q24 -14 48 0 q24 14 48 0" fill="none" stroke="#e4f4fa" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M376 462 q24 -14 48 0 q24 14 48 0" fill="none" stroke="#e4f4fa" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
