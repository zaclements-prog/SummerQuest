<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: draw under notches / the home indicator (the shell pads with env(safe-area-inset-*)).
         Pinch-zoom stays allowed for accessibility; double-tap zoom is turned off in CSS (touch-action). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- the cream top bar (--color-paper), so the browser chrome blends into it -->
    <meta name="theme-color" content="#fffaf0" />
    <!-- math answers must never turn into phone-number links on iOS -->
    <meta name="format-detection" content="telephone=no" />
    <title>SummerQuest</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
